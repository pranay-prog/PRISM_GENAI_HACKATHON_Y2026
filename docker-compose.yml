services:
  backend:
    build:
      context: ./backend
      args:
        PRELOAD_MODELS: ${PRELOAD_MODELS:-true}
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
        RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-base}
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-fallback}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      RETRIEVAL_THRESHOLD: ${RETRIEVAL_THRESHOLD:-0.70}
      MONITOR_THRESHOLD: ${MONITOR_THRESHOLD:-0.45}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-hybrid}
      RERANKER_BACKEND: ${RERANKER_BACKEND:-auto}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-auto}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
